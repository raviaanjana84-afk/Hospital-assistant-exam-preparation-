<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>धर्म ज्ञान महापरीक्षा | आचार्य हर्ष शर्मा</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --saffron: #e67e22;
            --deep: #7b1d1d;
            --gold: #f0a500;
            --cream: #fdf6ec;
            --green: #27ae60;
            --dark: #1a1a2e;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: var(--cream);
            color: var(--dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--deep) 0%, #c0392b 60%, var(--saffron) 100%);
            color: white;
            padding: 25px 20px 40px;
            text-align: center;
            position: relative;
            border-radius: 0 0 40px 40px;
        }
        header h1 {
            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: 20px;
            margin: 0;
            letter-spacing: 0.5px;
        }
        header .home-btn {
            position: absolute;
            left: 18px; top: 18px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        header .subhead {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 400;
        }

        .container {
            padding: 0 15px 80px;
            max-width: 520px;
            margin: auto;
        }

        /* TOPIC SCREEN */
        #topic-screen {
            background: white;
            border-radius: 24px;
            padding: 22px 18px;
            margin-top: -30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
        }
        #topic-screen h2 {
            font-size: 16px;
            margin: 0 0 18px;
            color: var(--deep);
            font-weight: 700;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .topic-btn {
            background: linear-gradient(135deg, #fff 0%, var(--cream) 100%);
            border: 1.5px solid #ecdcc8;
            border-radius: 16px;
            padding: 16px 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .topic-btn:hover, .topic-btn:active {
            transform: translateY(-3px);
            border-color: var(--saffron);
            box-shadow: 0 6px 18px rgba(230,126,34,0.18);
        }
        .topic-btn .icon {
            font-size: 26px;
            line-height: 1;
        }
        .topic-btn .label {
            font-size: 12px;
            font-weight: 700;
            color: var(--deep);
            line-height: 1.2;
        }
        .topic-btn .sublabel {
            font-size: 9px;
            color: #999;
            font-weight: 400;
        }

        /* QUIZ SCREEN */
        #quiz-screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 22px 18px;
            margin-top: -30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .timer-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .timer-circle {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: conic-gradient(var(--saffron) 0%, #eee 0%);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--deep);
            flex-shrink: 0;
            border: 3px solid #f5e4d0;
        }
        .timer-bar-outer {
            flex: 1;
            background: #f0f0f0;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
        }
        #timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--gold), var(--saffron));
            border-radius: 10px;
            transition: width 1s linear;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 16px;
        }
        .meta-row .topic-tag {
            background: var(--deep);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        #question {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            line-height: 1.5;
            font-family: 'Tiro Devanagari Sanskrit', serif;
        }

        .option-btn {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 2px solid #ececec;
            background: #fafafa;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--saffron);
            background: #fff5eb;
        }
        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: 600;
        }
        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        /* RESULT SCREEN */
        #result-screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            margin-top: -30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            text-align: center;
        }
        .score-ring {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--deep), var(--saffron));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(123,29,29,0.25);
        }
        .score-ring .num {
            font-size: 32px;
            font-weight: 700;
            color: white;
            line-height: 1;
        }
        .score-ring .denom {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }
        #result-screen h2 {
            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: 20px;
            color: var(--deep);
            margin: 0 0 8px;
        }
        #rank-text {
            font-size: 15px;
            color: var(--saffron);
            font-weight: 700;
            margin: 4px 0 20px;
        }
        .result-msg {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
        }
        .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-dark { background: var(--dark); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-next { background: linear-gradient(135deg, var(--deep), var(--saffron)); color: white; }

        .dots-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ddd;
            transition: 0.3s;
        }
        .dot.done { background: var(--green); }
        .dot.active { background: var(--saffron); transform: scale(1.3); }
        .dot.wrong-dot { background: #dc3545; }

        #batch-screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            margin-top: -30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            text-align: center;
        }
        .batch-emoji { font-size: 52px; margin-bottom: 10px; }
        #batch-screen h3 {
            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: 20px;
            color: var(--deep);
            margin: 0 0 6px;
        }
        #batch-score-text { font-size: 14px; color: #666; margin-bottom: 20px; }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: 0;
            width: 8px; height: 14px;
            border-radius: 2px;
            animation: fall linear forwards;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i></a>
    <h1>🕉️ धर्म ज्ञान परीक्षा</h1>
    <div class="subhead">आचार्य हर्ष शर्मा</div>
</header>

<div class="container">

    <!-- TOPIC SELECTION -->
    <div id="topic-screen">
        <h2>📚 विषय चुनें — परीक्षा शुरू करें</h2>
        <div class="topic-grid">
            <button class="topic-btn" onclick="startQuiz('ramayan')">
                <span class="icon">🏹</span>
                <span class="label">रामायण</span>
                <span class="sublabel">श्री राम कथा</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('gita')">
                <span class="icon">📖</span>
                <span class="label">भगवद् गीता</span>
                <span class="sublabel">कृष्ण उपदेश</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('mahakal')">
                <span class="icon">🔱</span>
                <span class="label">महाकाल</span>
                <span class="sublabel">बाबा महाकाल</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('mahabharat')">
                <span class="icon">⚔️</span>
                <span class="label">महाभारत</span>
                <span class="sublabel">कुरुक्षेत्र युद्ध</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('hanuman')">
                <span class="icon">🐒</span>
                <span class="label">हनुमान चरित</span>
                <span class="sublabel">बजरंग बली</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('devi')">
                <span class="icon">🌺</span>
                <span class="label">देवी शक्ति</span>
                <span class="sublabel">माँ दुर्गा</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('vedic')">
                <span class="icon">📿</span>
                <span class="label">वैदिक ज्ञान</span>
                <span class="sublabel">वेद &amp; पुराण</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('mix')">
                <span class="icon">🌟</span>
                <span class="label">मिश्रित</span>
                <span class="sublabel">सभी विषय</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('yoga')">
                <span class="icon">🧘</span>
                <span class="label">योग &amp; ध्यान</span>
                <span class="sublabel">आत्म-साधना</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('sant')">
                <span class="icon">💫</span>
                <span class="label">संत-महात्मा</span>
                <span class="sublabel">संत वाणी</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('jyotish')">
                <span class="icon">⭐</span>
                <span class="label">ज्योतिष &amp; रत्न</span>
                <span class="sublabel">ग्रह-नक्षत्र</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('upanishad')">
                <span class="icon">🕉️</span>
                <span class="label">उपनिषद</span>
                <span class="sublabel">वेदान्त दर्शन</span>
            </button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen">
        <div class="timer-wrap">
            <div class="timer-circle" id="timer-num">15</div>
            <div class="timer-bar-outer"><div id="timer-fill"></div></div>
        </div>
        <div class="meta-row">
            <span id="progress-text">प्रश्न 1 / 5</span>
            <span class="topic-tag" id="topic-tag">---</span>
        </div>
        <div class="dots-row" id="dots-row"></div>
        <div id="question"></div>
        <div id="options-container"></div>
    </div>

    <!-- BATCH COMPLETE -->
    <div id="batch-screen">
        <div class="batch-emoji" id="batch-emoji">🎉</div>
        <h3 id="batch-title">बढ़िया!</h3>
        <p id="batch-score-text">आपने 5 में से 4 सही किए!</p>
        <button class="btn-main btn-next" onclick="nextBatch()">अगले 5 प्रश्न ▶</button>
        <button class="btn-main btn-dark" style="margin-top: 8px;" onclick="endQuiz()">परीक्षा समाप्त करें</button>
    </div>

    <!-- RESULT -->
    <div id="result-screen">
        <div class="score-ring">
            <span class="num" id="final-num">0</span>
            <span class="denom" id="final-denom">/ 5</span>
        </div>
        <h2>परीक्षा पूर्ण! 🎉</h2>
        <div id="rank-text"></div>
        <p class="result-msg" id="result-msg"></p>
        <button class="btn-main btn-dark" onclick="backToTopics()">🔄 दूसरा विषय चुनें</button>
        <button class="btn-main btn-wa" onclick="shareOnWA()">
            <i class="fa-brands fa-whatsapp"></i> स्कोर शेयर करें
        </button>
    </div>

</div>

<script>
// ═══════════════════════════════════════════
//  TOPIC NAMES
// ═══════════════════════════════════════════
const TOPIC_NAMES = {
    ramayan: '🏹 रामायण',
    gita: '📖 भगवद् गीता',
    mahakal: '🔱 महाकाल',
    mahabharat: '⚔️ महाभारत',
    hanuman: '🐒 हनुमान',
    devi: '🌺 देवी शक्ति',
    vedic: '📿 वैदिक ज्ञान',
    mix: '🌟 मिश्रित',
    yoga: '🧘 योग & ध्यान',
    sant: '💫 संत-महात्मा',
    jyotish: '⭐ ज्योतिष & रत्न',
    upanishad: '🕉️ उपनिषद'
};

// ═══════════════════════════════════════════
//  QUESTION BANK — All topics (50 each)
// ═══════════════════════════════════════════

const bank = {

ramayan: [
  { q:"रामचरितमानस के रचयिता कौन हैं?", a:["वाल्मीकि","तुलसीदास","वेदव्यास","कालिदास"], c:1 },
  { q:"लक्ष्मण जी की पत्नी का नाम क्या था?", a:["शिल्पा","उर्मिला","मांडवी","श्रुतकीर्ति"], c:1 },
  { q:"हनुमान जी ने अशोक वाटिका में सीता माता को किसकी अंगूठी दी?", a:["स्वयं की","राम जी की","भरत जी की","रावण की"], c:1 },
  { q:"राम के पिता का नाम क्या था?", a:["दशरथ","जनक","भरत","शत्रुघ्न"], c:0 },
  { q:"सीता माता के पिता कौन थे?", a:["दशरथ","जनक","वशिष्ठ","विश्वामित्र"], c:1 },
  { q:"रावण के कितने सिर थे?", a:["8","10","12","20"], c:1 },
  { q:"हनुमान जी की माता का नाम क्या था?", a:["कैकेयी","अंजना","कौशल्या","सुमित्रा"], c:1 },
  { q:"राम ने वनवास कितने वर्ष बिताए?", a:["12","14","16","10"], c:1 },
  { q:"कौन सी देवी ने सीता के रूप में धरती से प्रकट हुईं?", a:["पार्वती","लक्ष्मी","सरस्वती","दुर्गा"], c:1 },
  { q:"रामायण में अशोक वाटिका किसके राज्य में थी?", a:["किष्किंधा","लंका","अयोध्या","पंचवटी"], c:1 },
  { q:"भरत जी की माता कौन थीं?", a:["कौशल्या","सुमित्रा","कैकेयी","शांता"], c:2 },
  { q:"राम का धनुष किसका बना था?", a:["शिव जी का","विष्णु जी का","इंद्र का","ब्रह्मा का"], c:0 },
  { q:"सुग्रीव के भाई का नाम क्या था?", a:["बालि","जामवंत","नल","नील"], c:0 },
  { q:"लंका में कितने द्वार थे?", a:["4","8","10","12"], c:1 },
  { q:"रावण की माता का नाम क्या था?", a:["कैकसी","मंदोदरी","सूर्पणखा","तारा"], c:0 },
  { q:"हनुमान जी ने समुद्र कितने योजन पार किया?", a:["50","100","200","500"], c:1 },
  { q:"अगस्त्य मुनि ने राम को किसकी स्तुति सिखाई?", a:["सूर्य की","चंद्र की","इंद्र की","शिव की"], c:0 },
  { q:"जटायु कौन था?", a:["वानर","गरुड़","गिद्ध","सांप"], c:2 },
  { q:"सम्पाती जटायु का क्या था?", a:["पुत्र","भाई","पिता","मित्र"], c:1 },
  { q:"किस नदी के किनारे राम का राज्याभिषेक हुआ?", a:["गंगा","यमुना","सरयू","शिप्रा"], c:2 },
  { q:"विभीषण ने राम से कब मित्रता की?", a:["युद्ध से पहले","युद्ध के बीच","सीता हरण के बाद","बाली वध के बाद"], c:0 },
  { q:"रावण किस ग्रह का भक्त था?", a:["मंगल","शनि","सूर्य","शिव"], c:3 },
  { q:"राम ने किसके वध के लिए ब्रह्मास्त्र का प्रयोग किया?", a:["रावण","मारीच","बाली","खर"], c:0 },
  { q:"पंचवटी किस राज्य में स्थित है?", a:["अयोध्या","नासिक क्षेत्र","लंका","किष्किंधा"], c:1 },
  { q:"हनुमान जी के पिता कौन थे?", a:["इंद्र","वायु","सूर्य","अग्नि"], c:1 },
  { q:"राम की शिक्षा किसने दी?", a:["वाल्मीकि","वशिष्ठ","विश्वामित्र","अगस्त्य"], c:1 },
  { q:"मंथरा कौन थी?", a:["सीता की सेविका","कैकेयी की दासी","कौशल्या की सखी","सूर्पणखा की बहन"], c:1 },
  { q:"राम ने सीता की खोज के लिए पहले किससे मित्रता की?", a:["विभीषण","सुग्रीव","जटायु","हनुमान"], c:1 },
  { q:"लव और कुश किसके पुत्र थे?", a:["राम-सीता","लक्ष्मण-उर्मिला","भरत-मांडवी","रावण-मंदोदरी"], c:0 },
  { q:"रामायण में सेतु का निर्माण किसने किया?", a:["राम ने","विभीषण ने","वानर सेना ने","हनुमान अकेले ने"], c:2 },
  { q:"कुंभकर्ण कितने महीने सोता था?", a:["3","6","1","9"], c:1 },

  { q:"'श्वासोपनिषद' में किसका वर्णन है?", a:["श्वास/प्राण","योग","ध्यान","आसन"], c:0 },
  { q:"'मृगोपनिषद' किस वेद से है?", a:["ऋग्वेद","यजुर्वेद","सामवेद","अथर्ववेद"], c:1 },
  { q:"'कौषीतकि उपनिषद' किस वेद से है?", a:["ऋग्वेद","सामवेद","यजुर्वेद","अथर्ववेद"], c:0 },
  { q:"'जाबाल उपनिषद' में किस संन्यास पर चर्चा है?", a:["संन्यास","गृहस्थ","ब्रह्मचर्य","वानप्रस्थ"], c:0 },
  { q:"'नारद परिव्राजक' उपनिषद किससे जुड़ा है?", a:["नारद","गौतम","याज्ञवल्क्य","उद्दालक"], c:0 },
  { q:"'परिव्राजक' उपनिषद में किसका वर्णन है?", a:["संन्यासी जीवन","गृहस्थ जीवन","राजा","देवता"], c:0 },
  { q:"'मैत्रायणी उपनिषद' किस वेद से है?", a:["यजुर्वेद","सामवेद","ऋग्वेद","अथर्ववेद"], c:0 },
  { q:"'सूर्योपनिषद' में किसका वर्णन है?", a:["सूर्य","चंद्र","अग्नि","वायु"], c:0 },
  { q:"'गणेशोपनिषद' में किसका वर्णन है?", a:["गणेश","शिव","पार्वती","कार्तिकेय"], c:0 },
  { q:"'अथर्वशिखा' उपनिषद किस वेद से है?", a:["अथर्ववेद","ऋग्वेद","यजुर्वेद","सामवेद"], c:0 },
],
  
}; // end bank

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const APP_LINK = "https://acharya-harsh-sharma.vercel.app/index.html";
const BATCH_SIZE = 5;
const TIME_PER_Q = 15;

let currentTopic = '';
let allQuestions = [];
let batchStart = 0;
let batchQuestions = [];
let curIdx = 0;
let batchScore = 0;
let totalScore = 0;
let totalAnswered = 0;
let timer;
let timeLeft = TIME_PER_Q;
let dotStates = [];

// ═══════════════════════════════════════════
//  FUNCTIONS
// ═══════════════════════════════════════════

function startQuiz(topic) {
    currentTopic = topic;
    allQuestions = [...bank[topic]].sort(() => 0.5 - Math.random());
    batchStart = 0;
    totalScore = 0;
    totalAnswered = 0;
    showScreen('quiz-screen');
    document.getElementById('topic-tag').innerText = TOPIC_NAMES[topic] || topic;
    loadBatch();
}

function loadBatch() {
    batchQuestions = allQuestions.slice(batchStart, batchStart + BATCH_SIZE);
    curIdx = 0;
    batchScore = 0;
    dotStates = Array(batchQuestions.length).fill('pending');
    if(batchQuestions.length > 0) dotStates[0] = 'active';
    renderDots();
    loadQuestion();
}

function loadQuestion() {
    if(curIdx >= batchQuestions.length) return finishBatch();
    clearInterval(timer);
    timeLeft = TIME_PER_Q;

    const data = batchQuestions[curIdx];
    const globalNum = batchStart + curIdx + 1;
    document.getElementById('progress-text').innerText = `प्रश्न ${globalNum} / ${Math.min(allQuestions.length, 50)}`;
    document.getElementById('question').innerText = data.q;

    const container = document.getElementById('options-container');
    container.innerHTML = "";
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => check(i, btn);
        container.appendChild(btn);
    });

    updateTimerUI();
    timer = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if(timeLeft <= 0) check(-1);
    }, 1000);
}

function updateTimerUI() {
    document.getElementById('timer-num').innerText = timeLeft;
    document.getElementById('timer-fill').style.width = (timeLeft / TIME_PER_Q * 100) + '%';
    const col = timeLeft > 8 ? '#f0a500' : '#e74c3c';
    document.getElementById('timer-fill').style.background = col;
    document.getElementById('timer-num').style.color = col;
                                       }

      function check(idx, btn) {
    clearInterval(timer);
    const correct = batchQuestions[curIdx].c;
    const allBtns = document.getElementsByClassName('option-btn');
    Array.from(allBtns).forEach(b => b.disabled = true);

    if(idx === correct) {
        batchScore++;
        totalScore++;
        if(btn) btn.classList.add('correct');
        dotStates[curIdx] = 'done';
    } else {
        if(idx !== -1 && btn) btn.classList.add('wrong');
        allBtns[correct].classList.add('correct');
        dotStates[curIdx] = 'wrong-dot';
    }
    totalAnswered++;

    if(curIdx + 1 < batchQuestions.length) dotStates[curIdx + 1] = 'active';
    renderDots();

    setTimeout(() => { curIdx++; loadQuestion(); }, 1300);
}

function renderDots() {
    const row = document.getElementById('dots-row');
    row.innerHTML = '';
    dotStates.forEach(state => {
        const d = document.createElement('div');
        d.className = 'dot ' + state;
        row.appendChild(d);
    });
}

function finishBatch() {
    showScreen('batch-screen');
    const emojis = batchScore === 5 ? '🏆' : batchScore >= 3 ? '👏' : '💪';
    document.getElementById('batch-emoji').innerText = emojis;
    const titles = batchScore === 5 ? 'शत-प्रतिशत! अद्भुत!' : batchScore >= 3 ? 'बहुत बढ़िया!' : 'और प्रयास करें!';
    document.getElementById('batch-title').innerText = titles;
    document.getElementById('batch-score-text').innerText = `आपने इस राउंड में ${batchScore} / 5 सही किए!\nकुल अब तक: ${totalScore} / ${totalAnswered}`;

    batchStart += BATCH_SIZE;
    if(batchStart >= allQuestions.length) {
        document.querySelector('#batch-screen .btn-next').style.display = 'none';
    } else {
        document.querySelector('#batch-screen .btn-next').style.display = 'block';
    }

    if(batchScore === 5) confetti();
}

function nextBatch() {
    showScreen('quiz-screen');
    loadBatch();
}

function endQuiz() {
    showScreen('result-screen');
    document.getElementById('final-num').innerText = totalScore;
    document.getElementById('final-denom').innerText = `/ ${totalAnswered}`;
    const pct = totalAnswered > 0 ? Math.round(totalScore / totalAnswered * 100) : 0;
    let rank, msg;
    if(pct >= 90) { rank = '🏆 धर्म मार्तंड'; msg = 'अप्रतिम! आप धर्म के विद्वान हैं।'; }
    else if(pct >= 70) { rank = '🌟 धर्म ज्ञाता'; msg = 'बहुत उत्तम! थोड़ा और अभ्यास करें।'; }
    else if(pct >= 50) { rank = '📖 धर्म जिज्ञासु'; msg = 'अच्छा प्रयास! नियमित पाठ जारी रखें।'; }
    else { rank = '🙏 आरंभिक भक्त'; msg = 'निराश न हों! धर्म ग्रंथ पढ़ें और पुनः प्रयास करें।'; }
    document.getElementById('rank-text').innerText = rank;
    document.getElementById('result-msg').innerText = msg;
}

function shareOnWA() {
    const pct = totalAnswered > 0 ? Math.round(totalScore / totalAnswered * 100) : 0;
    const rank = document.getElementById('rank-text').innerText;
    const text = `🕉️ मैंने आचार्य हर्ष शर्मा जी की वेबसाइट पर धर्म ज्ञान परीक्षा दी!\n\n📊 मेरा स्कोर: ${totalScore}/${totalAnswered} (${pct}%)\n🏅 उपाधि: ${rank}\n\n🙏 आप भी खेलें और अपना ज्ञान परखें:\n${APP_LINK}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}

function backToTopics() {
    showScreen('topic-screen');
    document.querySelector('#batch-screen .btn-next').style.display = 'block';
}

function showScreen(id) {
    ['topic-screen','quiz-screen','batch-screen','result-screen'].forEach(s => {
        document.getElementById(s).style.display = s === id ? 'block' : 'none';
    });
}

function confetti() {
    const colors = ['#e67e22','#f0a500','#7b1d1d','#27ae60','#3498db'];
    for(let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        p.style.animationDelay = Math.random() * 1 + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 4000);
    }
}
</script>
