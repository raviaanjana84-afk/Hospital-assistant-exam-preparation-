            --white: #ffffff;

        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            background: var(--cream);

        }

            background: rgba(255,255,255,0.15);

            display: flex;

            background: white;
            border-radius: 16px;

            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            padding: 8px 0;
            background: transparent;
        }
        .search-wrap i {
            color: var(--saffron);
            font-size: 18px;
        }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 16px 0 12px;
            scrollbar-width: none;
        }

        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid #ddd;
            background: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            color: #666;
        }
        .cat-tab.active {
            background: var(--deep);
            color: white;
            border-color: var(--deep);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--saffron);
        }

        .mantra-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .mantra-card {
            background: white;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-left: 5px solid var(--saffron);
            transition: 0.25s;

        .mantra-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .mantra-card .title {
            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: 20px;
            color: var(--deep);
            font-weight: 700;
        }
        .mantra-card .title .en {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: #999;
            margin-left: 8px;
        }

            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: 18px;
            color: var(--dark);
            background: var(--soft);
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 0;
            line-height: 1.8;
            text-align: center;
        }
        .mantra-card .devanagari .small {
            font-size: 13px;
            color: #888;
            display: block;
            margin-top: 4px;
        }
        .mantra-card .meaning {
            font-size: 14px;
            color: #444;
            line-height: 1.6;
            padding: 10px 14px;
            background: #f8f4f0;
            border-radius: 10px;
            margin: 8px 0;

        .mantra-card .meaning strong {
            color: var(--deep);
        }
        .mantra-card .benefits {
            font-size: 13px;
            color: #555;
            padding: 10px 14px;
            background: #eef7ee;
            border-radius: 10px;
            margin: 8px 0;
        }
        .mantra-card .benefits i {
            color: var(--green);
            margin-right: 6px;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .mantra-card .meta span {
            font-size: 10px;
            background: #eee;
            padding: 3px 12px;
            border-radius: 12px;
            color: #666;
        }

            background: var(--saffron);
            color: white;

            background: var(--deep);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;

</head>

// ============================================================
//  RENDER
// ============================================================

let currentCategory = 'all';
let searchQuery = '';

function renderMantras() {
    const grid = document.getElementById('mantraGrid');
    const filtered = mantraData.filter(m => {
        const matchCat = currentCategory === 'all' || m.category === currentCategory;
        const matchSearch = m.title.includes(searchQuery) || 
                           m.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           m.devanagari.includes(searchQuery) ||
                           m.god.includes(searchQuery);
        return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-result">
            <i class="fa-solid fa-search" style="font-size:30px;color:#ddd;display:block;margin-bottom:10px;"></i>
            कोई मंत्र नहीं मिला। कृपया दूसरा शब्द खोजें।
        </div>`;
        return;
    }

    grid.innerHTML = filtered.map(m => `
        <div class="mantra-card">
            <div class="title">
                ${m.title}
                <span class="en">${m.en}</span>
            </div>
            <div class="devanagari">
                ${m.devanagari.replace(/\n/g, '<br>')}
                <span class="small">${m.god} • ${m.category}</span>
            </div>
            <div class="meaning">
                <strong><i class="fa-solid fa-book-open" style="color:var(--saffron);"></i> अर्थ:</strong> ${m.meaning}
            </div>
            <div class="benefits">
                 <i class="fa-solid fa-heart"></i> <strong>लाभ:</strong> ${m.benefits}
            </div>
            <div class="meta">
                <span class="god"><i class="fa-solid fa-om"></i> ${m.god}</span>
                <span><i class="fa-regular fa-clock"></i> ${m.howTo || 'प्रातः/सायं 108 बार'}</span>
                <span><i class="fa-regular fa-folder"></i> ${m.category}</span>
            </div>
        </div>
    `).join('');
}

// ============================================================
//  FILTER FUNCTIONS
// ============================================================

function filterMantras() {
    searchQuery = document.getElementById('searchInput').value.trim();
    renderMantras();
}

// Category tabs
document.addEventListener('DOMContentLoaded', function() {
    renderMantras();

    document.querySelectorAll('.cat-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.cat;
            renderMantras();
        });
    });
});

// ============================================================
//  VOICE SEARCH (optional)
// ============================================================
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const mic = document.querySelector('.search-wrap i.fa-microphone');
    mic.style.cursor = 'pointer';
    mic.addEventListener('click', function() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.start();
        recognition.onresult = function(e) {
            const transcript = e.results[0][0].transcript;
            document.getElementById('searchInput').value = transcript;
            filterMantras();
        };
    });
}
